<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia 360° BTS</title>
    <!-- Librería A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0b;
            color: #fff;
        }

        /* Pantalla de Bienvenida */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f1135, #4b1557, #111);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        #welcome-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 3px;
            color: #d4a5ff;
            text-shadow: 0 0 15px rgba(212, 165, 255, 0.6);
            text-align: center;
            padding: 0 20px;
        }

        #welcome-screen p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #ccc;
            letter-spacing: 1px;
        }

        .bts-btn {
            background: linear-gradient(45deg, #7b2cbf, #9d4edd);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.7);
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .bts-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(157, 78, 221, 1);
            background: linear-gradient(45deg, #9d4edd, #c77dff);
        }

        /* Interfaz UI Navegación */
        #ui-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(10px);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid rgba(212, 165, 255, 0.3);
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #e0aaff;
            text-align: center;
        }

        .hud-bottom {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .nav-btn {
            background: rgba(30, 10, 50, 0.8);
            color: #fff;
            border: 1px solid #9d4edd;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .nav-btn:hover {
            background: #9d4edd;
            box-shadow: 0 0 15px #9d4edd;
        }

        .star-btn {
            background: linear-gradient(45deg, #7b2cbf, #9d4edd) !important;
            border: 1px solid #d4a5ff !important;
            color: #ffffff !important;
            font-size: 1.4rem !important;
            padding: 8px 22px !important;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.9) !important;
            animation: pulseStar 1.5s infinite alternate;
        }

        @keyframes pulseStar {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(157, 78, 221, 0.6); }
            100% { transform: scale(1.12); box-shadow: 0 0 30px rgba(212, 165, 255, 1); }
        }

        /* Escena de Ejecución del Código "Cod" */
        #cod-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            z-index: 9998;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #cod-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Control flotante dentro de la ejecución de Cod */
        .cod-overlay-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10001;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(15, 10, 25, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(212, 165, 255, 0.4);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
        }

        .cod-overlay-ui .song-tag {
            font-size: 0.9rem;
            color: #e0aaff;
            font-weight: 500;
        }

        /* Capa de Transición */
        #fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 10000;
            transition: opacity 0.6s ease;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Bienvenida -->
    <div id="welcome-screen">
        <h1>BTS 360° EXPERIENCE</h1>
        <p>Prepárate para un recorrido inmersivo</p>
        <button class="bts-btn" id="start-btn">INICIAR EXPERIENCIA</button>
    </div>

    <!-- Escena donde se ejecuta el archivo HTML "Cod.html" -->
    <div id="cod-screen">
        <div class="cod-overlay-ui">
            <span class="song-tag">🎶 Reproduciendo: 4. Permission</span>
            <button class="bts-btn" id="restart-btn" style="padding: 8px 20px; font-size: 0.9rem;">🔄 REINICIAR</button>
        </div>
        <iframe id="cod-frame"></iframe>
    </div>

    <!-- Capa de Transición Visual -->
    <div id="fade-overlay"></div>

    <!-- Escena 360 con A-Frame -->
    <a-scene embedded vr-mode-ui="enabled: false" renderer="antialias: true">
        <a-assets>
            <!-- Soporte dual PNG/JPG para la imagen 1 -->
            <img id="img-amb1" src="1.png" crossorigin="anonymous" onerror="if(!this.dataset.fallback){this.dataset.fallback=true; this.src='1.jpg';}">
            <img id="img-amb2" src="2.jpg" crossorigin="anonymous">
            <img id="img-amb3" src="3.jpg" crossorigin="anonymous">
            <a-mixin id="star-spin" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"></a-mixin>
        </a-assets>

        <a-sky id="sky-sphere" src="#img-amb1" rotation="0 -90 0"></a-sky>

        <a-entity id="bts-star" position="0 1.6 -3" visible="false">
            <a-entity mixin="star-spin">
                <a-cone class="raycastable" position="0 0.5 0" rotation="180 0 0" radius-bottom="0.45" height="0.9" color="#c77dff" material="emissive: #9d4edd; emissiveIntensity: 0.9;"></a-cone>
                <a-cone class="raycastable" position="0 -0.5 0" rotation="0 0 0" radius-bottom="0.45" height="0.9" color="#c77dff" material="emissive: #9d4edd; emissiveIntensity: 0.9;"></a-cone>
                <a-ring class="raycastable" radius-inner="0.65" radius-outer="0.8" rotation="90 0 0" color="#e0aaff" material="side: double; emissive: #e0aaff; emissiveIntensity: 1;"></a-ring>
            </a-entity>
        </a-entity>

        <a-entity camera look-controls="pointerLockEnabled: false" position="0 1.6 0">
            <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .raycastable"></a-entity>
        </a-entity>
    </a-scene>

    <!-- Interfaz de Navegación -->
    <div id="ui-container">
        <div class="hud-top" id="hud-title">AMBIENTE 1</div>
        <div class="hud-bottom">
            <button class="nav-btn" id="prev-btn" style="display: none;">ANTERIOR</button>
            <button class="nav-btn star-btn" id="star-btn" style="display: none;">⭐</button>
            <button class="nav-btn" id="next-btn">SIGUIENTE AMBIENTE</button>
        </div>
    </div>

    <!-- Audios del Proyecto -->
    <audio id="audio-1" src="1 Butter1.mp3" preload="auto" loop></audio>
    <audio id="audio-2" src="2. DYNAMITE.mp3" preload="auto" loop></audio>
    <audio id="audio-3" src="3. Boy.mp3" preload="auto" loop></audio>
    <audio id="audio-4" src="4. Permission.mp3" preload="auto" loop></audio>

    <script>
        let currentStage = 1;
        const sky = document.getElementById('sky-sphere');
        const welcomeScreen = document.getElementById('welcome-screen');
        const codScreen = document.getElementById('cod-screen');
        const codFrame = document.getElementById('cod-frame');
        const uiContainer = document.getElementById('ui-container');
        const hudTitle = document.getElementById('hud-title');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const starBtn = document.getElementById('star-btn');
        const restartBtn = document.getElementById('restart-btn');
        const fadeOverlay = document.getElementById('fade-overlay');
        const btsStar = document.getElementById('bts-star');

        const audios = {
            1: document.getElementById('audio-1'),
            2: document.getElementById('audio-2'),
            3: document.getElementById('audio-3'),
            4: document.getElementById('audio-4')
        };

        function stopAllAudios() {
            Object.values(audios).forEach(audio => {
                if (audio) {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });
        }

        function playAudio(stage) {
            stopAllAudios();
            if(audios[stage]) {
                audios[stage].play().catch(e => console.log("Esperando acción de usuario para audio", e));
            }
        }

        function triggerFade(callback) {
            fadeOverlay.style.opacity = '1';
            setTimeout(() => {
                callback();
                setTimeout(() => {
                    fadeOverlay.style.opacity = '0';
                }, 300);
            }, 600);
        }

        // Iniciar Experiencia
        document.getElementById('start-btn').addEventListener('click', () => {
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                uiContainer.style.display = 'block';
            }, 800);
            
            playAudio(1);
        });

        // Ejecutar Cod.html
        function executeCod() {
            stopAllAudios();
            triggerFade(() => {
                uiContainer.style.display = 'none';
                codScreen.style.display = 'block';
                codFrame.src = "Cod.html";

                setTimeout(() => {
                    codScreen.style.opacity = '1';
                }, 50);

                playAudio(4);
            });
        }

        // Botón Reiniciar
        restartBtn.addEventListener('click', () => {
            stopAllAudios();
            triggerFade(() => {
                codScreen.style.opacity = '0';
                codScreen.style.display = 'none';
                codFrame.src = "";

                currentStage = 1;
                sky.setAttribute('src', '#img-amb1');
                hudTitle.innerText = "AMBIENTE 1";
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'block';
                starBtn.style.display = 'none';
                btsStar.setAttribute('visible', 'false');
                
                uiContainer.style.display = 'block';
                playAudio(1);
            });
        });

        // Transición de Ambientes
        function updateStage(newStage) {
            triggerFade(() => {
                currentStage = newStage;
                
                if (currentStage === 1) {
                    sky.setAttribute('src', '#img-amb1');
                    hudTitle.innerText = "AMBIENTE 1";
                    prevBtn.style.display = 'none';
                    nextBtn.style.display = 'block';
                    starBtn.style.display = 'none';
                    btsStar.setAttribute('visible', 'false');
                } else if (currentStage === 2) {
                    sky.setAttribute('src', '#img-amb2');
                    hudTitle.innerText = "AMBIENTE 2: 2.jpg";
                    prevBtn.style.display = 'block';
                    nextBtn.style.display = 'block';
                    starBtn.style.display = 'none';
                    btsStar.setAttribute('visible', 'false');
                } else if (currentStage === 3) {
                    sky.setAttribute('src', '#img-amb3');
                    hudTitle.innerText = "AMBIENTE 3: 3.jpg";
                    prevBtn.style.display = 'block';
                    nextBtn.style.display = 'none';
                    starBtn.style.display = 'block';
                    btsStar.setAttribute('visible', 'true');
                }
                
                playAudio(currentStage);
            });
        }

        nextBtn.addEventListener('click', () => {
            if (currentStage === 1) updateStage(2);
            else if (currentStage === 2) updateStage(3);
        });

        prevBtn.addEventListener('click', () => {
            if (currentStage === 2) updateStage(1);
            else if (currentStage === 3) updateStage(2);
        });

        starBtn.addEventListener('click', executeCod);
        btsStar.addEventListener('click', executeCod);
    </script>
</body>
</html>
